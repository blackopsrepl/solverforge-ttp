scalar_groups = []
conflict_repairs = []

[app]
name = "ttp"
starter = "neutral-shell"
shell = "web"
cli_version = "3.6.0"

[runtime]
target = "solverforge 0.22.0"
runtime_source = "crates.io: solverforge 0.22.0"
ui_source = "crates.io: solverforge-ui 0.9.0"

[demo]
default_size = "standard"
available_sizes = [
    "small",
    "standard",
    "large",
]

[solution]
name = "Schedule"
score = "HardSoftScore"
scalar_groups_path = ""
conflict_repairs_path = ""

[[facts]]
name = "team"
plural = "teams"
kind = "problem_fact"

[[facts]]
name = "round"
plural = "rounds"
kind = "problem_fact"

[[entities]]
name = "game"
plural = "games"
kind = "planning_entity"

[[variables]]
entity = "game"
entity_plural = "games"
field = "round"
kind = "scalar"
range = "rounds"
elements = ""
allows_unassigned = false
enabled = true

[[constraints]]
name = "away_double_booking"
module = "away_double_booking"
enabled = true

[[constraints]]
name = "cross_side_double_booking"
